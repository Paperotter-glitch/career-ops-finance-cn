name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1" # 每周一 UTC 00:00 再跑一次招聘链接
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev tools
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check scripts tests
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Schema
        run: python scripts/check_portals.py
      - name: Link check
        run: python scripts/check_portals.py --links --fail-on-dead --timeout 8 --report link-report.json
      - name: Upload link report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: careers-link-report
          path: link-report.json
          if-no-files-found: ignore
